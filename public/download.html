<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Télécharge WITM — Who Is The Most ? Le jeu suisse à voter qui dit qui est le plus... dans ta bande." />
    <meta name="robots" content="index,follow" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/fav/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/fav/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/fav/apple-touch-icon.png" />
    <link rel="canonical" href="https://whoisthemost.com/download" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Télécharge WITM" />
    <meta property="og:description" content="Le jeu suisse pour découvrir qui est le plus... dans ta bande." />
    <meta property="og:image" content="https://whoisthemost.com/img/logo.png" />
    <meta property="og:url" content="https://whoisthemost.com/download" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Télécharge WITM — Who Is The Most ?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #6366f1;
        --secondary: #8b5cf6;
        --ink: #0f172a;
        --muted: #64748b;
        --bg: #ffffff;
        --bg-soft: #f8fafc;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        color: var(--ink);
        min-height: 100vh;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px 64px;
        text-align: center;
        position: relative;
      }
      .blob {
        position: fixed;
        border-radius: 9999px;
        filter: blur(80px);
        opacity: 0.18;
        pointer-events: none;
        z-index: 0;
      }
      .blob-a {
        top: -120px; right: -120px;
        width: 420px; height: 420px;
        background: radial-gradient(circle, #6366f1 0%, #8b5cf6 40%, transparent 70%);
      }
      .blob-b {
        bottom: -160px; left: -120px;
        width: 380px; height: 380px;
        background: radial-gradient(circle, #8b5cf6 0%, #6366f1 40%, transparent 70%);
      }
      .content { position: relative; z-index: 1; }
      .logo {
        width: 96px; height: 96px;
        border-radius: 24px;
        box-shadow: 0 12px 32px rgba(99, 102, 241, 0.25);
        margin-bottom: 24px;
      }
      .brand {
        font-family: 'Outfit', 'Inter', sans-serif;
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tagline {
        font-size: clamp(1rem, 2.4vw, 1.15rem);
        color: var(--muted);
        margin: 0 0 40px;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        margin-bottom: 40px;
      }
      .badges a {
        display: inline-flex;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      .badges a:hover { transform: translateY(-2px); opacity: 0.92; }
      .badges img { height: 56px; width: auto; display: block; }
      .qr-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 28px;
        max-width: 360px;
        margin: 0 auto;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }
      .qr-card h2 {
        font-family: 'Outfit', 'Inter', sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        margin: 0 0 6px;
        color: var(--ink);
      }
      .qr-card p {
        font-size: 0.9rem;
        color: var(--muted);
        margin: 0 0 18px;
      }
      .qr-card img {
        width: 100%;
        max-width: 240px;
        height: auto;
        display: block;
        margin: 0 auto;
        border-radius: 12px;
      }
      .redirecting {
        margin-top: 24px;
        font-size: 0.95rem;
        color: var(--muted);
      }
      .redirecting a { color: var(--primary); text-decoration: underline; font-weight: 500; }
      .foot {
        margin-top: 56px;
        font-size: 0.85rem;
        color: #94a3b8;
      }
      .foot a { color: var(--muted); text-decoration: none; }
      .foot a:hover { color: var(--primary); }
      .hidden { display: none !important; }
      @media (prefers-reduced-motion: reduce) {
        .badges a { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="blob blob-a" aria-hidden="true"></div>
    <div class="blob blob-b" aria-hidden="true"></div>

    <main class="wrap">
      <div class="content">
        <img src="/img/logo.png" alt="WITM logo" class="logo" />
        <h1 class="brand">WITM</h1>
        <p class="tagline">Who Is The Most ? Découvre qui est le plus… dans ta bande.</p>

        <section id="badges-desktop" class="badges" aria-label="Liens de téléchargement">
          <a href="https://apps.apple.com/ch/app/witm-who-is-the-most/id6740246093" aria-label="Télécharger sur l'App Store">
            <img src="/img/appstore-badge.svg" alt="Télécharger dans l'App Store" />
          </a>
          <a href="https://play.google.com/store/apps/details?id=com.qelp.ch" aria-label="Disponible sur Google Play">
            <img src="/img/googleplay-badge.svg" alt="Disponible sur Google Play" />
          </a>
        </section>

        <section id="qr-block" class="qr-card" aria-label="QR code de téléchargement">
          <h2>Scanne pour télécharger</h2>
          <p>Ouvre l'appareil photo de ton téléphone et vise le QR code.</p>
          <img src="/img/qr-download.png" alt="QR code menant à whoisthemost.com/download" />
        </section>

        <p id="redirect-msg" class="redirecting hidden">
          Redirection vers le store… <a id="manual-link" href="#">cliquez ici si rien ne se passe</a>.
        </p>

        <p class="foot">
          <a href="/">whoisthemost.com</a>
        </p>
      </div>
    </main>

    <script>
      (function () {
        var APP_STORE = 'https://apps.apple.com/ch/app/witm-who-is-the-most/id6740246093';
        var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.qelp.ch';

        var ua = navigator.userAgent || navigator.vendor || '';
        var platform = navigator.platform || '';
        var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                    (platform === 'MacIntel' && typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints > 1);
        var isAndroid = /android/i.test(ua);

        var target = null;
        if (isIOS) target = APP_STORE;
        else if (isAndroid) target = PLAY_STORE;

        if (target) {
          var badges = document.getElementById('badges-desktop');
          var qr = document.getElementById('qr-block');
          var msg = document.getElementById('redirect-msg');
          var link = document.getElementById('manual-link');
          if (badges) badges.classList.add('hidden');
          if (qr) qr.classList.add('hidden');
          if (link) link.href = target;
          if (msg) msg.classList.remove('hidden');
          window.location.replace(target);
        }
      })();
    </script>
  </body>
</html>
